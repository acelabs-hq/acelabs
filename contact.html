<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — ACE Labs</title><meta name="description" content="Contact ACE Labs."><style>
:root{--bg:#f6f5f1;--fg:#171815;--mut:#62645d;--card:#fff;--line:#dedcd3;--acc:#c8501e}
@media(prefers-color-scheme:dark){:root{--bg:#151614;--fg:#f1f0ea;--mut:#a3a59b;--card:#1d1e1b;--line:#2f312b;--acc:#ff8a57}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 Georgia,'Times New Roman',serif}
h1,h2,h3,nav,.tag,button,.btn,footer{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
a{color:inherit}.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
nav{display:flex;align-items:center;justify-content:space-between;height:60px}
nav .logo{font-weight:800;letter-spacing:.04em;text-decoration:none}
nav .logo span{color:var(--acc)}
nav ul{display:flex;gap:20px;list-style:none;margin:0;padding:0;font-size:14px}
nav ul a{text-decoration:none;color:var(--mut)}nav ul a:hover{color:var(--fg)}
.btn{display:inline-block;background:var(--fg);color:var(--bg);padding:11px 20px;border-radius:999px;text-decoration:none;font-size:15px;font-weight:600}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
section{padding:72px 0;border-bottom:1px solid var(--line)}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700}
h1{font-size:clamp(40px,7vw,76px);line-height:1.05;margin:12px 0 18px;letter-spacing:-.03em}
h2{font-size:clamp(28px,4vw,40px);line-height:1.15;margin:8px 0 14px;letter-spacing:-.02em}
h3{margin:0 0 6px;font-size:19px}
p{margin:0 0 14px}.lead{font-size:20px;color:var(--mut);max-width:640px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card p{color:var(--mut);font-size:15px;margin:0}
.card .tag{display:block;margin-bottom:8px}
.ace{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.ace div{flex:1 1 220px;border-left:3px solid var(--acc);padding-left:14px}
.ace b{font:800 34px system-ui;display:block;color:var(--acc)}
.logos{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.logos span{border:1px dashed var(--line);border-radius:10px;padding:14px 22px;font:600 14px system-ui;color:var(--mut)}
.steps{counter-reset:s}.steps .card::before{counter-increment:s;content:"0" counter(s);font:800 14px system-ui;color:var(--acc);display:block;margin-bottom:8px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--line);display:grid;place-items:center;font:700 22px system-ui;margin-bottom:12px}
details{border-top:1px solid var(--line);padding:16px 0}details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font:600 17px system-ui}details p{margin:10px 0 0;color:var(--mut)}
form{display:grid;gap:12px;max-width:520px;margin-top:20px}
input,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
footer{padding:36px 0;font-size:14px;color:var(--mut)}footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.hero{background:#0e0f0d;color:#f1f0ea;position:relative;overflow:hidden;border-bottom:1px solid #2f312b}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;position:relative}
.hero .lead{color:#a3a59b}.hero .btn{background:#ff8a57;color:#151614}.hero .btn.ghost{background:none;color:#f1f0ea;border-color:#3a3c35}
.hero h1 em{font-style:normal;color:#ff8a57}
#net{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.term{background:#161714;border:1px solid #2f312b;border-radius:12px;font:13px/1.7 ui-monospace,Menlo,monospace;color:#c9cbc0;padding:0 0 14px;position:relative;box-shadow:0 20px 60px #0008}
.term .bar{padding:10px 14px;border-bottom:1px solid #2f312b;color:#777a70;font-size:12px}
.term pre{margin:0;padding:14px;white-space:pre-wrap;min-height:230px}
.ok{color:#7fd48a}.hi{color:#ff8a57}.dim{color:#777a70}
.rocket{display:inline-block;animation:lift 3s ease-in-out infinite}@keyframes lift{50%{transform:translateY(-4px)}}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.rocket{animation:none}}
.note{font:13px system-ui;color:var(--mut);margin-top:14px}


nav ul a.on{color:var(--fg);font-weight:700}
@media(max-width:720px){nav{flex-wrap:wrap;height:auto;padding:12px 0 8px}nav .btn{display:none}nav ul{display:flex;order:3;width:100%;gap:16px;overflow-x:auto;padding:10px 0}}
.bp{background:#0b0d10;color:#dfe6ee;border-bottom:1px solid #2f312b;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:32px 32px}
.bp .lead{color:#9aa4b0}.bp svg{width:100%;height:auto;margin-top:18px;display:block}
.bp .ln{fill:none;stroke:#7fd4ff;stroke-width:1.4;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3.2s ease forwards}
.bp .dash{fill:none;stroke:#ff8a57;stroke-width:1.2;stroke-dasharray:4 5}
.bp .call{stroke:#4b5a6a;stroke-width:1}.bp text{font:12px ui-monospace,Menlo,monospace;fill:#dfe6ee}.bp .sub{fill:#7f8b98;font-size:10.5px}.bp .num{fill:#ff8a57}
.bp .flame{fill:none;stroke:#ff8a57;stroke-width:1.4;stroke-dasharray:3 4;animation:flick 1.2s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes flick{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.bp .ln{animation:none;stroke-dashoffset:0}.bp .flame{animation:none}}
.pagehead{padding:64px 0 40px;border-bottom:1px solid var(--line)}
.list{padding-left:18px;margin:12px 0 0;color:var(--mut);font-size:15px}.list li{margin:4px 0}
.cta{text-align:center}.cta .lead{margin:0 auto 22px}
.post{display:block;text-decoration:none;padding:22px 0;border-top:1px solid var(--line)}.post:last-child{border-bottom:1px solid var(--line)}
.post h3{font-size:22px}.post p{color:var(--mut);margin:0}
.two{display:grid;gap:36px;grid-template-columns:1fr 1fr;align-items:start}@media(max-width:720px){.two{grid-template-columns:1fr}}
</style></head><body>

<main><section class="pagehead" style="border:0"><div class="wrap"><div class="tag">Contact</div><h1>What are you trying to fix?</h1><p class="lead">Bring a prototype, a decision, or a workflow that should work better.</p>

<p class="note">Or email <a href="mailto:ace@gmail.com">ace@gmail.com</a></p></div></section></main>
<footer><div class="wrap"><span>© 2026 ACE Labs — AI, Cloud &amp; Engineering · <a href="mailto:ace@gmail.com">ace@gmail.com</a></span><span><a href="#">LinkedIn</a> · <a href="https://github.com/YOUR-USERNAME/ace-labs">GitHub</a> · <a href="https://x.com/acelabs">X</a></span></div></footer></body></html>
